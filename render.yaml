services:
  - type: web
    name: agrobalance
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrobalance-db
          property: connectionString
      - key: COOKIE_SECURE
        value: 'true'
      - key: ENABLE_DEMO
        value: 'true'

databases:
  - name: agrobalance-db
    plan: free
    databaseName: agrobalance
    user: agrobalance
